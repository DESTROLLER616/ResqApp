# .github/workflows/cd.yml
name: CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libfuse2 \
            xdg-utils \
            rpm

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref == 'refs/heads/develop' && 'v__VERSION__-beta' || 'v__VERSION__' }}
          releaseName: ${{ github.ref == 'refs/heads/develop' && 'ResqApp v__VERSION__ (beta)' || 'ResqApp v__VERSION__' }}
          releaseBody: Instaladores Linux (AppImage, deb, rpm).
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ github.ref == 'refs/heads/develop' }}
